server {
    listen 80;
    root /usr/share/nginx/html;

    # Fichiers générés par Vite (nom avec hash) : cache long
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Routes vue-router (createWebHistory) : renvoyer index.html, jamais mis en cache
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
